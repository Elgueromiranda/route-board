name: Build and deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch: # This adds a "Run workflow" button in the GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: routeboardregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push to ACR
        run: |
          docker build -t routeboardregistry.azurecr.io/route-board:${{ github.sha }} ./route_board
          docker push routeboardregistry.azurecr.io/route-board:${{ github.sha }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'route-board'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'routeboardregistry.azurecr.io/route-board:${{ github.sha }}'
