# PostgreSQL. Versions 9.5 and up are supported.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  username: <%= ENV.fetch("DATABASE_USER", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "password") %>

development:
  <<: *default
  database: route_board_development

test:
  <<: *default
  database: route_board_test

production:
  primary: &primary_production
    <<: *default
    host: <%= ENV["DB_HOST"] %>
    database: <%= ENV["DB_DATABASE"] %>
    username: <%= ENV["DB_USER"] %>
    password: <%= ENV["DB_PASSWORD"] %>
    sslmode: require
  cache:
    <<: *primary_production
    database: route_board_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: route_board_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: route_board_production_cable
    migrations_paths: db/cable_migrate