services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./route_board:/app
    command: bash -c "rm -f tmp/pids/server.pid && START_POLLEN=true bundle exec rails s -b 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    build:
      context: ./route-board
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./route-board:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_API_BASE_URL: http://localhost:3000